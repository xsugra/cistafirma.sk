#       - "${WEB_PORT:-8000}:8000"  # Expose web port for direct access if needed, nginx will use this
# Configuration is loaded from root .env file
# Copy from .env.default: cp .env.default .env

# Docker json-file log rotation for every long-running service. Changing
# `logging:` recreates containers -> take a fresh verified DB backup before
# `docker compose up -d` (see Makefile db-backup / db-backup-verify).
x-logging: &logging-default
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Shared Celery template for every worker + beat. Lives at the TOP level so the
# `x-` key is an extension field = anchor ONLY, not a runnable service. (An `x-`
# key *inside* `services:` is an ordinary service name — before this fix that
# silently spawned a stray duplicate gunicorn container,
# cistafirma-x-celery-worker-1.)
x-celery-worker: &celery-worker
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  # Log rotation inherited by every *celery-worker service + beat.
  logging: *logging-default
  env_file:
    - ./.env
  environment:
    - DATABASE_URL=postgres://${POSTGRES_USER:-cistafirma}:${POSTGRES_PASSWORD:-cistafirma_secret}@db:5432/${POSTGRES_DB:-cistafirma}
    - REDIS_URL=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
    - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
    - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  # The backend image carries a gunicorn HEALTHCHECK; workers/beat don't run
  # gunicorn, so disable it here (inherited by every *celery-worker + beat).
  healthcheck:
    disable: true

services:
  db:
    image: postgres:16-alpine
    container_name: cistafirma_db
    restart: unless-stopped
    logging: *logging-default
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cistafirma}
      POSTGRES_USER: ${POSTGRES_USER:-cistafirma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cistafirma_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # localhost only; DB never exposed to LAN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cistafirma}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cistafirma_redis
    restart: unless-stopped
    logging: *logging-default
    # Auth is required (defence in depth even though the port is localhost-only).
    # REDIS_PASSWORD must be URL-safe (A-Za-z0-9 _ - .); percent-encode specials.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-cistafirma_redis_secret}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-cistafirma_redis_secret}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-cistafirma_redis_secret}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"  # localhost only; broker never exposed to LAN
    volumes:
      - redis_data:/data
    healthcheck:
      # redis-cli in redis:7 reads REDISCLI_AUTH from the container env, so the
      # probe stays secret-free.
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
#       - "${WEB_PORT:-8000}:8000"  # Expose web port for direct access if needed, nginx will use this
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cistafirma_backend
    restart: unless-stopped
    logging: *logging-default
    env_file:
      - ./.env  # Load from root .env (centralized config)
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-cistafirma}:${POSTGRES_PASSWORD:-cistafirma_secret}@db:5432/${POSTGRES_DB:-cistafirma}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
      # prometheus_client multiprocess mode. With >1 worker each process would
      # otherwise export its own counters and a scrape would alternate between
      # them, breaking rate(). Set on the backend only: Celery containers have
      # no scrape target and must not share this directory. Wiped at gunicorn
      # startup by backend/gunicorn.conf.py.
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-multiproc
    ports:
      # Loopback only, like db and redis. Nothing in the stack needs this on the
      # LAN: the frontend container reaches the backend over the compose network
      # as `backend:8000`. While it was published on 0.0.0.0 the whole API, the
      # Django admin and /metrics (whose guard trusts any private address) were
      # reachable from every machine on the network. Override BIND_HOST only if
      # you deliberately want that -- this host holds production data.
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations are NOT auto-run here anymore — apply them via the one-shot
    # `migrate` service (make docker-migrate). collectstatic stays (dev uses a
    # bind mount, so this is cheap); celery_beat waits for migrations via
    # `migrate --check`.
    command: >
      sh -c "python manage.py collectstatic --noinput --settings=backend.settings &&
             gunicorn --config /app/gunicorn.conf.py --bind 0.0.0.0:8000 --workers ${BACKEND_WORKERS:-2} --threads ${BACKEND_THREADS:-4} --timeout 120 --worker-class gthread --worker-tmp-dir /dev/shm backend.wsgi:application"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cistafirma_frontend
    restart: unless-stopped
    logging: *logging-default
    env_file:
      - ./.env
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
      - FRONTEND_PORT=${FRONTEND_PORT:-5173}
    ports:
      # Loopback only (see the backend service). The Vite dev server proxies
      # `/api/` to the backend, so while this was on 0.0.0.0 a LAN client could
      # reach the entire API through the proxy even with the backend port bound
      # to loopback -- both ports have to be bound for the exposure to close.
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  celery_worker_ruz:
    <<: *celery-worker
    container_name: cistafirma_celery_ruz
    command: celery -A backend worker -l info -Q ruz_full -n worker_ruz@%h --concurrency=1

  celery_worker_orsr:
    <<: *celery-worker
    container_name: cistafirma_celery_orsr
    command: celery -A backend worker -l info -Q orsr -n worker_orsr@%h --concurrency=2

  celery_worker_financials:
    <<: *celery-worker
    container_name: cistafirma_celery_financials
    command: celery -A backend worker -l info -Q financials -n worker_financials@%h --concurrency=4

  celery_worker_insurance:
    <<: *celery-worker
    container_name: cistafirma_celery_insurance
    command: celery -A backend worker -l info -Q insurance -n worker_insurance@%h --concurrency=2

  celery_worker_default:
    <<: *celery-worker
    container_name: cistafirma_celery_default
    command: celery -A backend worker -l info -Q celery -n worker_default@%h --concurrency=2

  celery_beat:
    <<: *celery-worker
    container_name: cistafirma_celery_beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: >
      sh -c "echo 'Waiting for migrations...' &&
             while ! python manage.py migrate --check 2>/dev/null; do
               sleep 2
             done &&
             echo 'Migrations ready, starting beat...' &&
             celery -A backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  # One-shot migration runner — NOT part of plain `docker compose up`
  # (profile keeps it out). Run via `make docker-migrate` (docker compose run).
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["migrate"]
    restart: "no"
    env_file:
      - ./.env  # Load from root .env (centralized config)
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-cistafirma}:${POSTGRES_PASSWORD:-cistafirma_secret}@db:5432/${POSTGRES_DB:-cistafirma}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["python", "manage.py", "migrate", "--settings=backend.settings"]

  # ---------------------------------------------------------------------------
  # Opt-in observability stack. Both services sit in the `monitoring` profile,
  # so a plain `docker compose up` stays completely inert and neither container
  # is created. Start them explicitly with:
  #   docker compose --profile monitoring up -d prometheus grafana
  # Both UIs bind to loopback only — nothing here is reachable from the LAN.
  # Neither service declares `networks:`, matching every other service in this
  # file: they join the compose default network, so `backend` resolves via
  # Docker DNS.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: cistafirma_prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging-default
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - cistafirma_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"  # loopback only; UI never exposed to LAN

  grafana:
    image: grafana/grafana:13.2.1
    container_name: cistafirma_grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging-default
    environment:
      # Sane non-secret default; override via GRAFANA_ADMIN_PASSWORD in .env.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-cistafirma}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Alert delivery. These two are read by the provisioned Telegram contact
      # point in provisioning/alerting/contact-points.yml.
      #
      # Grafana interpolates $VAR in provisioning files, and a variable that is
      # UNSET resolves to the empty string -- it does not fail. An unset token
      # therefore provisions a contact point that looks fine and silently sends
      # nothing.
      #
      # NOTHING HERE VERIFIES DELIVERY, and nothing can: the only way to test a
      # contact point is to send a message through it, and a weekly gate that
      # posts to Telegram every week is a gate nobody reads. So this is the one
      # control in the stack whose only proof is a human watching a chat: after
      # setting the token, use Grafana's "Test" button on the contact point and
      # confirm the message arrives. The file provisioning cleanly is not that
      # confirmation, and neither is this comment.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - cistafirma_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"  # loopback only; UI never exposed to LAN
    depends_on:
      - prometheus

  # Postgres exporter. Reads the SAME interpolated POSTGRES_* credentials the
  # backend uses, so no second copy of the password exists and no new database
  # role is created — a new role would be a schema change, and a schema change
  # requires a fresh verified backup first.
  #
  # No `ports:` on purpose: Prometheus reaches it as `postgres_exporter:9187`
  # over the compose default network, so it publishes nothing on the host.
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: cistafirma_postgres_exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging-default
    environment:
      # sslmode=disable: the connection never leaves the compose network.
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-cistafirma}:${POSTGRES_PASSWORD:-cistafirma_secret}@db:5432/${POSTGRES_DB:-cistafirma}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # Redis exporter: the broker, and the Celery queues themselves. A Celery queue
  # is a Redis list, so its depth is `redis_key_size` here — the same LLEN that
  # scripts/local/ops_check.sh reads. `--check-keys` is what makes those keys
  # show up at all; without it the exporter never reports list lengths.
  #
  # Careful: `redis_key_size` only exists for a key that exists. An empty queue
  # that Redis has already reaped reports *nothing*, not 0, so anything consuming
  # this must write `or vector(0)` rather than treat absence as healthy.
  redis_exporter:
    image: oliver006/redis_exporter:v1.92.1
    container_name: cistafirma_redis_exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging-default
    command:
      - "--check-keys=celery,ruz_full,orsr,financials,insurance"
    environment:
      - REDIS_ADDR=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Application-level operational verdicts: whether a sync job is stuck, whether
  # a source stopped advancing, whether a beat entry is overdue. These are
  # judgements, not measurements -- they live in Python
  # (`backend/registers/services/ops_health.py`, which the three `*_health`
  # management commands now only render) and cannot be expressed as a PromQL rule
  # over the counters the backend exports.
  #
  # It runs from the BACKEND IMAGE, not a prebuilt exporter, because it has to
  # read the database through the same models and the same thresholds the
  # commands use: a second implementation of "is this stuck" is a second answer
  # that will disagree with `make ops-check` exactly when it matters.
  #
  # No `ports:` here -- Prometheus reaches it at ops_exporter:9101 over the
  # compose network. That matters more than usual: this endpoint has no auth
  # layer, and /metrics on the backend is deliberately guarded.
  ops_exporter:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cistafirma_ops_exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging-default
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-cistafirma}:${POSTGRES_PASSWORD:-cistafirma_secret}@db:5432/${POSTGRES_DB:-cistafirma}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-cistafirma_redis_secret}@redis:6379/0
      # Deliberately NOT PROMETHEUS_MULTIPROC_DIR. That variable exists for
      # gunicorn's multi-process mode; this service is one process, and sharing
      # the backend's directory would make each scrape read the other's files.
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image's HEALTHCHECK probes gunicorn, which this service does not run.
    healthcheck:
      disable: true
    command: ["python", "manage.py", "run_ops_exporter", "--bind", "0.0.0.0", "--port", "9101"]

volumes:
  postgres_data:
  redis_data:
  static_volume:
  frontend_node_modules:
  cistafirma_prometheus_data:
  cistafirma_grafana_data:
