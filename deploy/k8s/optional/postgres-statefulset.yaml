apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cistafirma-postgres-pvc
  namespace: cistafirma
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cistafirma-postgres
  namespace: cistafirma
spec:
  serviceName: cistafirma-postgres
  replicas: 1
  selector:
    matchLabels:
      app: cistafirma-postgres
  template:
    metadata:
      labels:
        app: cistafirma-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cistafirma-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cistafirma-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cistafirma-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cistafirma-postgres
  namespace: cistafirma
spec:
  selector:
    app: cistafirma-postgres
  ports:
    - port: 5432
      targetPort: 5432

