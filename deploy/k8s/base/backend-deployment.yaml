apiVersion: apps/v1
kind: Deployment
metadata:
  name: cistafirma-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cistafirma-backend
  template:
    metadata:
      labels:
        app: cistafirma-backend
    spec:
      initContainers:
        - name: wait-for-migrations
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cistafirma-config
            - secretRef:
                name: cistafirma-secrets
          command:
            - sh
            - -c
            - |
              until python -c "import urllib.parse as u, socket, os; url=u.urlparse(os.environ['DATABASE_URL']); s=socket.socket(); s.settimeout(3); s.connect((url.hostname, url.port or 5432)); s.close()" 2>/dev/null; do
                echo "Waiting for Postgres..."
                sleep 2
              done
              echo "Postgres reachable, waiting for migrations..."
              until python manage.py migrate --check --settings=backend.settings 2>/dev/null; do
                echo "Migrations pending, waiting..."
                sleep 3
              done
              echo "Migrations up-to-date."
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cistafirma-config
            - secretRef:
                name: cistafirma-secrets
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
