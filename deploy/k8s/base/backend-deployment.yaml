apiVersion: apps/v1
kind: Deployment
metadata:
  name: cistafirma-backend
  namespace: cistafirma
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cistafirma-backend
  template:
    metadata:
      labels:
        app: cistafirma-backend
    spec:
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cistafirma-config
            - secretRef:
                name: cistafirma-secrets
          livenessProbe:
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

