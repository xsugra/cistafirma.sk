{{- if .Values.migrateJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cistafirma.fullname" . }}-migrate
  labels:
    {{- include "cistafirma.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrateJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrateJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "cistafirma.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: {{ include "cistafirma.backendImage" . }}
          imagePullPolicy: {{ .Values.global.backendImage.pullPolicy | default "IfNotPresent" }}
          envFrom:
            - secretRef:
                name: {{ include "cistafirma.existingSecret" . }}
          command:
            - sh
            - -c
            - |
              until python -c "import urllib.parse as u, socket, os, sys; url=u.urlparse(os.environ['DATABASE_URL']); s=socket.socket(); s.settimeout(3); s.connect((url.hostname, url.port or 5432)); s.close()" 2>/dev/null; do
                echo "Waiting for Postgres..."
                sleep 2
              done
              echo "Postgres is up."
      containers:
        - name: migrate
          image: {{ include "cistafirma.backendImage" . }}
          imagePullPolicy: {{ .Values.global.backendImage.pullPolicy | default "IfNotPresent" }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: {{ include "cistafirma.fullname" . }}-config
            - secretRef:
                name: {{ include "cistafirma.existingSecret" . }}
          command:
            - sh
            - -c
            - |
              python manage.py migrate --settings=backend.settings && \
              python manage.py collectstatic --noinput --settings=backend.settings
{{- end }}
