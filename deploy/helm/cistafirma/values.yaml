global:
  backendImage:
    repository: registry.example.com/cistafirma/backend
    tag: latest
    pullPolicy: IfNotPresent
  frontendImage:
    repository: registry.example.com/cistafirma/frontend
    tag: latest
    pullPolicy: IfNotPresent
  existingSecret: cistafirma-secrets
  ingressClassName: nginx
  host: cistafirma.example.com

config:
  djangoSettingsModule: backend.settings
  allowedHosts: "*"
  corsAllowedOrigins: https://cistafirma.example.com
  csrfTrustedOrigins: https://cistafirma.example.com
  backendPort: "8000"

backend:
  replicaCount: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

frontend:
  replicaCount: 2
  # Adresa clusterového DNS, ktorú nginx potrebuje na `resolver` (pozri
  # frontend/nginx.conf.template). Zámerne **prázdna**, a to je rozhodnutie,
  # nie vynechanie: odvodiť sa nedá, pretože každý klaster má inú, a nginx sa
  # pri preklade za behu na /etc/resolv.conf neobracia.
  #
  # Prázdna hodnota zlyhá **hlasito** — nginx odmietne štart s
  # `no name servers defined`. Nesprávna hodnota zlyhá **ticho** — 502 na
  # každej požiadavke, a frontend pod sa pritom hlási ako zdravý, lebo jeho
  # probe je voči backendu zámerne slepý. Preto tu nie je predvolená hodnota.
  #
  # Typické hodnoty: kubeadm a kind `10.96.0.10`, k3s `10.43.0.10`.
  # Over si ju pre svoj klaster:
  #   kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'
  backendResolver: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# PodDisruptionBudget — zabraňuje evikcii všetkých replík naraz pri node draine.
pdb:
  enabled: true
  backendMinAvailable: 1
  frontendMinAvailable: 1

ingress:
  enabled: true
  host: cistafirma.example.com
  tls:
    enabled: false
    secretName: ""

migrateJob:
  enabled: true
  ttlSecondsAfterFinished: 86400
  backoffLimit: 1

# In-cluster Postgres + Redis (pre lokál / dev). V prod použi managed DB a tieto vypni.
postgres:
  enabled: true
  image: postgres:16-alpine
  storageClass: ""
  storageSize: 20Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

redis:
  enabled: true
  image: redis:7-alpine
  storageClass: ""
  storageSize: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Celery workery — každá queue má vlastný deployment, škáluje sa nezávisle.
celery:
  beat:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 250m
        memory: 256Mi
  workers:
    # RUZ bulk sync — MUSÍ byť 1 replica (drží SyncProgress kurzor).
    ruz:
      enabled: true
      queue: ruz_full
      replicaCount: 1
      concurrency: 1
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    # ORSR scraper — škálovateľný, ale pozor na rate limit orsr.sk.
    orsr:
      enabled: true
      queue: orsr
      replicaCount: 2
      concurrency: 2
      resources:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Hospodárske výsledky z RUZ API — tolerantné na paralelizmus.
    financials:
      enabled: true
      queue: financials
      replicaCount: 2
      concurrency: 4
      resources:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # VSZP + Soc. poisťovňa — scrapery cudzích stránok, riziko banu.
    insurance:
      enabled: true
      queue: insurance
      replicaCount: 1
      concurrency: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Default queue (FS, orchestračné, ad-hoc).
    default:
      enabled: true
      queue: celery
      replicaCount: 1
      concurrency: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

# Denný pg_dump CronJob — zapisuje do backup PVC.
backup:
  enabled: true
  schedule: "0 3 * * *"
  retentionDays: 14
  storageClass: ""
  storageSize: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
