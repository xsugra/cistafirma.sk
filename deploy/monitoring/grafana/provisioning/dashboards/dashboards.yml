# Grafana dashboard provider provisioning (opt-in `monitoring` profile).
#
# Loads every *.json under /var/lib/grafana/dashboards, which is the read-only
# bind mount of deploy/monitoring/grafana/dashboards.
apiVersion: 1

providers:
  - name: CistaFirma
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
