# Grafana alerting provisioning — where an alert is delivered.
#
# Loaded from /etc/grafana/provisioning/alerting, which is the read-only bind
# mount of deploy/monitoring/grafana/provisioning. Grafana therefore owns no
# alert configuration that is not in the repository, and a rebuild cannot lose it.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: cistafirma-telegram
        type: telegram
        # $TELEGRAM_BOT_TOKEN and $TELEGRAM_CHAT_ID are interpolated by Grafana
        # from the container environment — see the `grafana` service in
        # docker-compose.yml, which takes them from the root .env.
        #
        # An UNSET variable interpolates to the empty string, and that empty
        # `bottoken` is then REJECTED here -- "could not find Bot Token in
        # settings" -- which does not merely skip this file: a failed
        # provisioning module takes the whole Grafana process down with it
        # (exit 1, restart-loop), dashboards and login included. Measured
        # 2026-10-01 on grafana/grafana:13.2.1.
        #
        # That is why neither of these two ever interpolates to empty: the
        # `grafana` service in docker-compose.yml supplies a self-describing
        # placeholder when the real value is missing, so an unconfigured channel
        # costs a failed delivery instead of the monitoring stack. The
        # placeholder is not a working channel -- it names itself in the
        # delivery error (`.../botUNSET-TELEGRAM-BOT-TOKEN/sendMessage`) and in
        # this file's settings in the Grafana UI, and alerts evaluate and
        # notify nobody until the real token is in .env.
        #
        # Whichever of the two is in place, the file existing is not evidence
        # that alerts arrive: send a test notification and watch the chat.
        #
        # The message is written out in plain text on purpose. Telegram parses
        # markup in message bodies, and every label this stack alerts on is
        # snake_case — a formatting character that Telegram reads as markup turns
        # the send into an error, and an error here is an alert nobody sees.
        # Plain text cannot be misread. Verify with a test notification.
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CHAT_ID
          message: |
            {{ range .Alerts }}{{ .Status | toUpper }}: {{ .Labels.alertname }}
            {{ .Annotations.summary }}
            {{ if .Annotations.description }}{{ .Annotations.description }}
            {{ end }}{{ end }}
        disableResolveMessage: false
