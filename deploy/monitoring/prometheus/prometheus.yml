# Prometheus scrape configuration for the opt-in `monitoring` profile.
#
# This file is mounted read-only into the `prometheus` service at
# /etc/prometheus/prometheus.yml. Prometheus and the backend share the compose
# default network, so the service name `backend` resolves via Docker DNS.

global:
  # Matches the per-job interval required by the CistaFirma Overview dashboard.
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: cistafirma

scrape_configs:
  # Self-scrape so the Prometheus UI can report its own TSDB health.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics. The backend container runs gunicorn on port 8000
  # (`gunicorn --bind 0.0.0.0:8000`, EXPOSE 8000) and exposes /metrics there via
  # the cistafirma_http_requests_total /
  # cistafirma_http_request_duration_seconds collectors.
  - job_name: cistafirma-backend
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    static_configs:
      - targets: ["backend:8000"]

  # Host metrics for BOTH machines — this stack is the central monitoring for
  # `dell` and `sam-lenovo` alike, not just for CistaFirma. Each host runs the
  # same node_exporter agent (quay.io/prometheus/node-exporter:v1.12.1) from
  # /home/sam/node-exporter, and each binds 9100 to its own tailnet address
  # only, so these targets are reachable from here and from nowhere else.
  #
  # Targets are tailnet IPs rather than hostnames deliberately: Prometheus runs
  # in a container on the compose network, so `dell` would not resolve and
  # 127.0.0.1 would be this container. The `host` label is what dashboards group
  # by, so re-IPing the tailnet is a one-line change here plus BIND_IP in that
  # host's /home/sam/node-exporter/.env.
  - job_name: node
    static_configs:
      - targets: ["100.79.47.4:9100"]
        labels:
          host: dell
      - targets: ["100.120.104.84:9100"]
        labels:
          host: sam-lenovo

  # Database and broker. Both exporters join the compose default network and
  # publish no host port, so these are Docker DNS names, not 127.0.0.1 and not
  # tailnet IPs. There is deliberately no METRICS_TOKEN here: they have no auth
  # layer at all, which is why they must never get a `ports:` entry.
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]

  # Application-level operational verdicts: whether a sync job is stuck, whether
  # a source stopped advancing, whether a beat entry is overdue. The exporter is
  # the backend image running `manage.py run_ops_exporter`, so these numbers come
  # out of the same code `make ops-check` runs, not a re-implementation of it.
  #
  # A longer interval than the other jobs on purpose. One of the three domains
  # aggregates `CompanySyncStatus` (a row per company per source, up to ~1.5M),
  # so it is cached inside the exporter and evaluated roughly once a minute;
  # scraping faster than the cache would add load to production without adding
  # information. `cistafirma_ops_evaluated_timestamp_seconds` is what tells you
  # how fresh the number you are reading actually is.
  - job_name: cistafirma-ops
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    static_configs:
      - targets: ["ops_exporter:9101"]

# Alerting rules live in deploy/monitoring/grafana/provisioning/alerting/ and are
# evaluated by Grafana's unified alerting, not by Prometheus — so this file stays
# a pure scrape configuration and Prometheus needs no rule_files entry.
