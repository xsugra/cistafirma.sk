
<!DOCTYPE html>
<html lang="sk" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cistafirma.sk - Home</title>
    <!-- Added typography plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Professional Brand Blue
              brand: {
                DEFAULT: '#2563eb', // blue-600
                hover: '#1d4ed8',   // blue-700
                light: '#eff6ff',   // blue-50
              },
              // Dark Mode Palette (Deep Blue/Black)
              dark: {
                bg: '#020617',    // slate-950 (Deepest Blue/Black)
                card: '#0f172a',  // slate-900
                border: '#1e293b',// slate-800
                text: '#f8fafc',  // slate-50
                muted: '#94a3b8', // slate-400
              },
              // Light Mode Palette (Crisp White/Black)
              light: {
                bg: '#ffffff',
                card: '#ffffff',
                border: '#e2e8f0', // slate-200
                text: '#0f172a',   // slate-900 (High contrast black-blue)
                muted: '#64748b',  // slate-500
              }
            },
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },
            // Customizing prose for dark mode and branding
            typography: (theme) => ({
              DEFAULT: {
                css: {
                  color: theme('colors.gray.700'),
                  a: {
                    color: theme('colors.blue.600'),
                    '&:hover': {
                      color: theme('colors.blue.700'),
                    },
                  },
                  'h2, h3, h4': {
                    color: theme('colors.gray.900'),
                    fontWeight: '700',
                  },
                  code: {
                    color: theme('colors.pink.500'),
                  },
                },
              },
              invert: {
                css: {
                  color: theme('colors.gray.300'),
                  a: {
                    color: theme('colors.blue.400'),
                    '&:hover': {
                      color: theme('colors.blue.300'),
                    },
                  },
                  'h2, h3, h4': {
                    color: theme('colors.white'),
                  },
                  strong: {
                    color: theme('colors.white'),
                  },
                  code: {
                    color: theme('colors.pink.400'),
                  },
                },
              },
            }),
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react-markdown": "https://esm.sh/react-markdown@9.0.1?bundle",
        "remark-gfm": "https://esm.sh/remark-gfm@4.0.0?bundle"
      }
    }
    </script>
    <style>
      /* Smooth transitions for theme switching */
      body {
        transition: color 0.3s ease;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="text-light-text dark:text-dark-text min-h-screen flex flex-col font-sans transition-colors duration-300">
    <div id="root" class="flex-grow flex flex-col"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
