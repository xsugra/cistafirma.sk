
<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply saved theme before first paint (matches ThemeContext logic).
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cistafirma.sk - Home</title>
    <!-- Tab icons. They live in `frontend/public/`, which `vite build` copies
         verbatim into `dist/`, and nginx serves straight off the site root.
         `/favicon.ico` has to be a real file at that root, because the clients
         that ask for it by that exact path -- a bookmark list, a link preview, a
         browser that has not parsed this page yet -- never read these lines. The
         miss used to be answered by `try_files $uri $uri/ /index.html` with a 200
         and this page, which a browser draws as no icon at all rather than as an
         error. Regenerate after replacing the logo: scripts/generate-favicons.py -->
    <!-- `sizes="any"` on the .ico rather than a number: the file holds 16, 32 and
         48, and a single number there is a claim about the file that is false. -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>
    <style>
      /* Smooth transitions for theme switching */
      body {
        transition: color 0.3s ease;
      }
    </style>
  </head>
  <body class="text-light-text dark:text-dark-text min-h-screen flex flex-col font-sans transition-colors duration-300">
    <div id="root" class="flex-grow flex flex-col"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
