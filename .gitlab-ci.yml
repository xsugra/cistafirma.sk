stages:
  - validate
  - test

variables:
  GIT_STRATEGY: clone  # Add this line to force a fresh clone

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

backend_validate:
  stage: validate
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - python --version
    - pip install --no-cache-dir --retries 3 --timeout 120 -r backend/requirements.txt
  script:
    - python -m compileall backend

# Shared frontend CI setup (node + deps from the committed lockfile).
.frontend_ci:
  image: node:20-alpine
  before_script:
    - cd frontend
    - |
      if [ -f package-lock.json ]; then
        npm ci
      else
        npm install
      fi

frontend_validate:
  extends: .frontend_ci
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm run build

docs_audit:
  stage: validate
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - python scripts/docs/check_markdown_links.py

# Helm: lint and render templates for dev + prod (dry-run validation).
#
# Tento job zámerne NEOBSAHUJE python3 krok. `alpine/helm` je holé Alpine
# s helmom a python3 v ňom NIE JE — `python3 scripts/k8s/...` preto padalo
# na `exit 127 (command not found)`. Kontrola vyrenderovaného manifestu je
# preto samostatný job nižšie, v obraze, ktorý python3 naozaj má.
helm_render_validate:
  stage: validate
  image:
    name: alpine/helm:3.17.2
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - mkdir -p deploy/helm/cistafirma/.rendered
    - helm lint deploy/helm/cistafirma
    - helm template cistafirma-dev deploy/helm/cistafirma -f deploy/helm/cistafirma/values.yaml -f deploy/helm/cistafirma/values-dev.yaml --namespace cistafirma-dev > deploy/helm/cistafirma/.rendered/cistafirma-dev-render.yaml
    - helm template cistafirma-prod deploy/helm/cistafirma -f deploy/helm/cistafirma/values.yaml -f deploy/helm/cistafirma/values-prod.yaml --namespace cistafirma > deploy/helm/cistafirma/.rendered/cistafirma-prod-render.yaml
  artifacts:
    paths:
      - deploy/helm/cistafirma/.rendered/cistafirma-dev-render.yaml
      - deploy/helm/cistafirma/.rendered/cistafirma-prod-render.yaml
    expire_in: 1 day

# Kontrola, že vyrenderovaný release vôbec obsahuje async workery pre všetky
# fronty. Chráni Helm chart ako budúci deploy kontrakt — je to jediná vec,
# ktorá overuje, že nasadenie by naozaj spustilo všetkých päť workerov.
helm_runtime_validate:
  stage: validate
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: helm_render_validate
      artifacts: true
  script:
    - python3 scripts/k8s/validate_helm_runtime.py deploy/helm/cistafirma/.rendered/cistafirma-dev-render.yaml
    - python3 scripts/k8s/validate_helm_runtime.py deploy/helm/cistafirma/.rendered/cistafirma-prod-render.yaml

frontend_tests:
  extends: .frontend_ci
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm test
    - npm run typecheck

# Testy MUSIA bežať na Postgrese — a dovtedy tento job neurobil ani jeden test.
#
# Bez `DATABASE_URL` sa `settings.py` ticho prepne na SQLite. Lenže migrácia
# `companies/0014_add_pattern_ops_structured_indexes.py` vytvára index s
# `text_pattern_ops`, čo je Postgres-only trieda operátorov. Na SQLite teda
# spadne už `create_test_db` — ešte pred prvým testom — hlásením
# `near "text_pattern_ops": syntax error`, a job je červený vždy, nech je kód
# akýkoľvek. Nebol to slabý test, bol to test s nulovým výpovedným obsahom.
# (Index nie je ozdobný: `companies/services/peers.py` sa oň opiera pri
# prefixovom hľadaní, takže „spravme migráciu prenosnou" by znamenalo ničiť
# produkčný index kvôli CI.)
#
# Preto service kontajner s tou istou verziou, akú prevádzkuje produkcia
# (`docker-compose.yml` → `postgres:16-alpine`).
backend_tests:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  services:
    - name: postgres:16-alpine
      alias: postgres
    # Redis je tu z toho istého dôvodu: bez neho padne šesť testov na
    # `ConnectionError` (päť v hľadaní osôb, jeden admin dashboard) a healthz
    # test čaká 200, ale dostane 503 — spolu sedem výsledkov. Aj to je dôkaz,
    # že job predtým nič nekontroloval: v CI nie je `.env`, takže `REDIS_URL`
    # ostal na predvolenom `localhost` a na tom nič nebeží.
    - name: redis:7-alpine
      alias: redis
  variables:
    # Jednorazové prihlasovacie údaje efemérneho service kontajnera. Nie sú to
    # secrets a nemajú nič spoločné s produkčnou databázou na delle.
    POSTGRES_USER: cistafirma
    POSTGRES_PASSWORD: cistafirma
    POSTGRES_DB: cistafirma
    DATABASE_URL: "postgres://cistafirma:cistafirma@postgres:5432/cistafirma"
    # `CACHE_REDIS_URL` sa z tohto odvodí sám (databáza broker + 1), takže
    # stačí jediná premenná — viď `_default_cache_redis_url` v settings.py.
    REDIS_URL: "redis://redis:6379/0"
    DEBUG: "true"
  before_script:
    - pip install --no-cache-dir --retries 3 --timeout 120 -r backend/requirements.txt
    # Runner na otvorenie portu service kontajnera čaká sám; táto slučka je
    # poistka, ktorá z prípadných pretekov spraví zrozumiteľnú vetu namiesto
    # `connection refused` z prostriedku testovacej sady.
    - |
      python - <<'PY'
      import socket, sys, time
      for pokus in range(60):
          try:
              socket.create_connection(("postgres", 5432), timeout=2).close()
              print(f"Postgres prijima spojenia (pokus {pokus + 1}).")
              break
          except OSError:
              time.sleep(1)
      else:
          sys.exit("Postgres service sa nerozbehol do 60 s.")
      PY
  script:
    - cd backend
    # Produkcia pred štartom púšťa `collectstatic && gunicorn`
    # (docker-compose.yml) a testy ho potrebujú z toho istého dôvodu.
    #
    # `DiscoverRunner` má `debug_mode=False`, takže si Django `settings.DEBUG`
    # počas testov prepne na False sám — `DEBUG: "true"` vyššie to nezmení.
    # A `HashedFilesMixin.url` skracuje na obyčajné meno len keď je DEBUG True,
    # takže v testoch je `CompressedManifestStaticFilesStorage` striktná.
    # Bez manifestu padne šesť testov admin dashboardov na
    # `Missing staticfiles manifest entry for 'unfold/fonts/inter/styles.css'`.
    #
    # Vypnúť tú striktnosť (`WHITENOISE_MANIFEST_STRICT = False`) by bolo
    # nesprávne: je to tá istá vec, ktorá v produkcii odhalí chýbajúci
    # statický súbor.
    - python manage.py collectstatic --noinput
    - python manage.py test --verbosity=1

# ---------------------------------------------------------------------------
# Čo tu ZÁMERNE už nie je a prečo (15. 9. 2026)
#
# Stages `build` a `deploy` boli odstránené aj s celým svojím obsahom
# (.build_template, build_backend_image, build_frontend_image,
# .deploy_template, deploy_dev, deploy_main_to_dev, deploy_prod)
# a spolu s nimi job helm_k8s_validate a premenné, ktoré obsluhovali.
#
# `build` — obrazy sa pushovali do GitLab registra, ktorý NIČ NEČÍTA.
#   Produkcia na delle stavia sama z `build:` kontextu v docker-compose
#   (overené: v celom docker-compose.yml je `image:` len pri cudzích
#   obrazoch — postgres, redis, prometheus, grafana — a dell v .env nemá
#   ani jednu zmienku o registri). Jediný konzument bol Helm chart, ktorého
#   values ukazujú na `registry.example.com` — placeholder, ktorý neexistuje.
#   Navyše build potrebuje `docker:dind`, teda privileged, čo runner na
#   sam-lenovo zámerne nevie a Mac, ktorý to ako jediný vedel, už runner
#   nie je. Bol to job, ktorý vyrábal niečo, čo nikto nečíta.
#
# `deploy` — `.deploy_template` nepodmienene robí
#   `echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config`, ale KUBE_CONFIG nie
#   je definovaná nikde (projekt, skupina, inštancia). K8s klaster nemáme.
#   Job teda nemal ako prejsť — a job, ktorý nemôže prejsť, učí ľudí
#   ignorovať červenú. Presne to je trieda chyby, ktorá 11. 9. 2026
#   nechala CI štyri dni mŕtve bez toho, aby si to niekto všimol.
#
# `helm_k8s_validate` — `kubectl apply --dry-run=client` aj tak robí
#   discovery voči API serveru, takže bez klastra neprejde. A jeho obraz
#   `bitnami/kubectl:1.30` na Docker Hube neexistuje (Bitnami presunul free
#   obrazy do `bitnamilegacy`) — padal by na pull image na akomkoľvek runneri.
#
# Validate + test ostávajú: to sú joby, ktoré naozaj prejdú a naozaj niečo
# chránia. Bežia na sam-lenovo (projektový runner, `run_untagged = true`).
# ---------------------------------------------------------------------------
