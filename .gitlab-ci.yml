stages:
  - validate
  - test

variables:
  GIT_STRATEGY: clone  # Add this line to force a fresh clone

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

backend_validate:
  stage: validate
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - python --version
    - pip install --no-cache-dir --retries 3 --timeout 120 -r backend/requirements.txt
  script:
    - python -m compileall backend

# Shared frontend CI setup (node + deps from the committed lockfile).
.frontend_ci:
  image: node:20-alpine
  before_script:
    - cd frontend
    - |
      if [ -f package-lock.json ]; then
        npm ci
      else
        npm install
      fi

frontend_validate:
  extends: .frontend_ci
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm run build

docs_audit:
  stage: validate
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - python scripts/docs/check_markdown_links.py

# Helm: lint and render templates for dev + prod (dry-run validation).
#
# Tento job zámerne NEOBSAHUJE python3 krok. `alpine/helm` je holé Alpine
# s helmom a python3 v ňom NIE JE — `python3 scripts/k8s/...` preto padalo
# na `exit 127 (command not found)`. Kontrola vyrenderovaného manifestu je
# preto samostatný job nižšie, v obraze, ktorý python3 naozaj má.
helm_render_validate:
  stage: validate
  image:
    name: alpine/helm:3.17.2
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - mkdir -p deploy/helm/cistafirma/.rendered
    - helm lint deploy/helm/cistafirma
    - helm template cistafirma-dev deploy/helm/cistafirma -f deploy/helm/cistafirma/values.yaml -f deploy/helm/cistafirma/values-dev.yaml --namespace cistafirma-dev > deploy/helm/cistafirma/.rendered/cistafirma-dev-render.yaml
    - helm template cistafirma-prod deploy/helm/cistafirma -f deploy/helm/cistafirma/values.yaml -f deploy/helm/cistafirma/values-prod.yaml --namespace cistafirma > deploy/helm/cistafirma/.rendered/cistafirma-prod-render.yaml
  artifacts:
    paths:
      - deploy/helm/cistafirma/.rendered/cistafirma-dev-render.yaml
      - deploy/helm/cistafirma/.rendered/cistafirma-prod-render.yaml
    expire_in: 1 day

# Kontrola, že vyrenderovaný release vôbec obsahuje async workery pre všetky
# fronty. Chráni Helm chart ako budúci deploy kontrakt — je to jediná vec,
# ktorá overuje, že nasadenie by naozaj spustilo všetkých päť workerov.
helm_runtime_validate:
  stage: validate
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: helm_render_validate
      artifacts: true
  script:
    - python3 scripts/k8s/validate_helm_runtime.py deploy/helm/cistafirma/.rendered/cistafirma-dev-render.yaml
    - python3 scripts/k8s/validate_helm_runtime.py deploy/helm/cistafirma/.rendered/cistafirma-prod-render.yaml

frontend_tests:
  extends: .frontend_ci
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm test
    - npm run typecheck

backend_tests:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    DEBUG: "true"
  before_script:
    - pip install --no-cache-dir --retries 3 --timeout 120 -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py test --verbosity=1

# ---------------------------------------------------------------------------
# Čo tu ZÁMERNE už nie je a prečo (15. 9. 2026)
#
# Stages `build` a `deploy` boli odstránené aj s celým svojím obsahom
# (.build_template, build_backend_image, build_frontend_image,
# .deploy_template, deploy_dev, deploy_main_to_dev, deploy_prod)
# a spolu s nimi job helm_k8s_validate a premenné, ktoré obsluhovali.
#
# `build` — obrazy sa pushovali do GitLab registra, ktorý NIČ NEČÍTA.
#   Produkcia na delle stavia sama z `build:` kontextu v docker-compose
#   (overené: v celom docker-compose.yml je `image:` len pri cudzích
#   obrazoch — postgres, redis, prometheus, grafana — a dell v .env nemá
#   ani jednu zmienku o registri). Jediný konzument bol Helm chart, ktorého
#   values ukazujú na `registry.example.com` — placeholder, ktorý neexistuje.
#   Navyše build potrebuje `docker:dind`, teda privileged, čo runner na
#   sam-lenovo zámerne nevie a Mac, ktorý to ako jediný vedel, už runner
#   nie je. Bol to job, ktorý vyrábal niečo, čo nikto nečíta.
#
# `deploy` — `.deploy_template` nepodmienene robí
#   `echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config`, ale KUBE_CONFIG nie
#   je definovaná nikde (projekt, skupina, inštancia). K8s klaster nemáme.
#   Job teda nemal ako prejsť — a job, ktorý nemôže prejsť, učí ľudí
#   ignorovať červenú. Presne to je trieda chyby, ktorá 11. 9. 2026
#   nechala CI štyri dni mŕtve bez toho, aby si to niekto všimol.
#
# `helm_k8s_validate` — `kubectl apply --dry-run=client` aj tak robí
#   discovery voči API serveru, takže bez klastra neprejde. A jeho obraz
#   `bitnami/kubectl:1.30` na Docker Hube neexistuje (Bitnami presunul free
#   obrazy do `bitnamilegacy`) — padal by na pull image na akomkoľvek runneri.
#
# Validate + test ostávajú: to sú joby, ktoré naozaj prejdú a naozaj niečo
# chránia. Bežia na sam-lenovo (projektový runner, `run_untagged = true`).
# ---------------------------------------------------------------------------
