stages:
  - validate
  - test
  - build
  - deploy

variables:
  # TLS medzi job kontajnerom a DinD je VYPNUTE NASCHVAL. Vysvetlenie je
  # v .build_template nizsie — kratka verzia: certy sa nemaju ako zdielat,
  # takze zapnute TLS znamena, ze sa klient a demon nikdy nenajdu.
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  GIT_STRATEGY: clone  # Add this line to force a fresh clone
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  K8S_NAMESPACE: "cistafirma"
  STRICT_K8S_VALIDATION: "false"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

backend_validate:
  stage: validate
  tags: [lenovo]
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - python --version
    - pip install --no-cache-dir --retries 3 --timeout 120 -r backend/requirements.txt
  script:
    - python -m compileall backend

frontend_validate:
  stage: validate
  tags: [lenovo]
  image: node:20-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - cd frontend
    - |
      if [ -f package-lock.json ]; then
        npm ci
      else
        npm install
      fi
  script:
    - npm run build

docs_audit:
  stage: validate
  tags: [lenovo]
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - python scripts/docs/check_markdown_links.py

# Helm: lint and render templates for dev + prod (dry-run validation).
helm_render_validate:
  stage: validate
  tags: [lenovo]
  image:
    name: alpine/helm:3.17.2
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - mkdir -p deploy/helm/cistafirma/.rendered
    - helm lint deploy/helm/cistafirma
    - helm template cistafirma-dev deploy/helm/cistafirma -f deploy/helm/cistafirma/values.yaml -f deploy/helm/cistafirma/values-dev.yaml --namespace cistafirma-dev > deploy/helm/cistafirma/.rendered/cistafirma-dev-render.yaml
    - helm template cistafirma-prod deploy/helm/cistafirma -f deploy/helm/cistafirma/values.yaml -f deploy/helm/cistafirma/values-prod.yaml --namespace cistafirma > deploy/helm/cistafirma/.rendered/cistafirma-prod-render.yaml
  artifacts:
    paths:
      - deploy/helm/cistafirma/.rendered/cistafirma-dev-render.yaml
      - deploy/helm/cistafirma/.rendered/cistafirma-prod-render.yaml
    expire_in: 1 day

# Helm+kubectl: validate rendered manifests against cluster schema (dry-run).
helm_k8s_validate:
  stage: validate
  tags: [lenovo]
  image:
    name: bitnamilegacy/kubectl:1.30
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: helm_render_validate
      artifacts: true
  before_script:
    - |
      if [ -n "$KUBE_CONFIG" ]; then
        mkdir -p ~/.kube
        echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      fi
  script:
    # Pozor: `kubectl apply --dry-run=client` NIE je offline operacia. RESTMapper
    # si pred spracovanim manifestu vyziada discovery z API servera (kind ->
    # resource). Bez klastra teda skonci na
    #   unable to recognize ... dial tcp [::1]:8080: connection refused
    # a to aj s --validate=false. Preto sa cele kubectl volanie spusta len
    # vtedy, ked je klaster skutocne dosiahnutelny.
    - |
      if kubectl cluster-info >/dev/null 2>&1; then
        kubectl apply --dry-run=client -f deploy/helm/cistafirma/.rendered/cistafirma-dev-render.yaml
        kubectl apply --dry-run=client -f deploy/helm/cistafirma/.rendered/cistafirma-prod-render.yaml
        kubectl apply --dry-run=server -f deploy/helm/cistafirma/.rendered/cistafirma-dev-render.yaml
        kubectl apply --dry-run=server -f deploy/helm/cistafirma/.rendered/cistafirma-prod-render.yaml
      elif [ "$STRICT_K8S_VALIDATION" = "true" ]; then
        echo "STRICT_K8S_VALIDATION=true but no usable cluster context is available."
        exit 1
      else
        echo "No reachable cluster -> skipping kubectl validation."
        echo "Rendered manifests are still checked by 'helm lint' + 'helm template' in helm_render_validate."
      fi

backend_tests:
  stage: test
  tags: [lenovo]
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    DEBUG: "true"
  before_script:
    - pip install --no-cache-dir --retries 3 --timeout 120 -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py test --verbosity=1

.build_template:
  stage: build
  tags: [macos]
  # Staci samotne CLI. Plny `docker:27.1.2` obsahuje aj dockerd a jeho
  # entrypoint by sa pokusil spustit druhy demon v job kontajneri.
  image: docker:27.1.2-cli
  services:
    # Registry bezi na HTTP (gitlab.home.arpa:5050), takze DinD musí vedieť,
    # že je "insecure". Týka sa to push/pull — tie idú cez démona.
    # (Na `docker login` to nestačí, viď before_script nižšie.)
    - name: docker:27.1.2-dind
      command: ["--insecure-registry=gitlab.home.arpa:5050"]
  variables:
    # POZOR, tu bola druha chyba. Obe strany (klient aj DinD) sa riadia
    # vylucne touto premennou a kazda si ju vyklada sama:
    #
    #  * DinD: ak je nastavena, vygeneruje certy do /certs/server a pocuva
    #    LEN na 2376 s TLS. Ak je prazdna, pocuva na 2375 bez TLS.
    #  * Klient (docker-entrypoint.sh v docker image): DOCKER_HOST nastavi
    #    na 2376 IBA ked funkcia _should_tls() najde vsetky tri subory
    #    $DOCKER_TLS_CERTDIR/client/{ca,cert,key}.pem. Inak na 2375.
    #
    # Tie tri .pem subory ale vznikaju v DinD kontajneri, a runner medzi
    # job a service kontajner tento adresar NEZDiela (v binarke runnera nie
    # je ani jeden vyskyt "certs/client" ci "DOCKER_TLS_CERTDIR"). Vysledok
    # pri zapnutom TLS: DinD na 2376, klient na 2375, a build vzdy spadne na
    #   error during connect: ... dial tcp ...: connect: connection refused
    #
    # Preto je TLS vypnute a DOCKER_HOST je nastaveny natvrdo. Obe strany
    # hovoria na 2375. Demon je pritom efemerny, zije len pocas jobu a je
    # dosiahnutelny vyhradne z privatnej siete toho-ktorého jobu.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    # POZOR: `docker login` tu NEMOZE byt. Je to klientska operacia — ide
    # PRIAMO na registry a demona vobec nepouzije, takze --insecure-registry
    # na DinD mu nepomoze. Na HTTP registry skonci vzdy na
    #   Get "https://gitlab.home.arpa:5050/v2/": http: server gave HTTP
    #   response to HTTPS client
    # (overene: chyba je bez prefixu "Error response from daemon").
    # Zapiseme credentials rovno do docker configu. CLI ich pri pushi odovzda
    # demonovi a ten HTTP zvladne — ma --insecure-registry.
    #
    # Diagnostika: nech je v trace rovno vidiet, na co sa CLI pripaja a ci
    # DinD vobec odpoveda. Pri mrtvom DinD padneme tu, s jasnou hlaskou.
    - docker version
    - docker info >/dev/null
    - mkdir -p ~/.docker
    - |
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > ~/.docker/config.json

build_backend_image:
  extends: .build_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    - docker build -f backend/Dockerfile -t "$BACKEND_IMAGE:$IMAGE_TAG" backend
    - docker push "$BACKEND_IMAGE:$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$BACKEND_IMAGE:$IMAGE_TAG" "$BACKEND_IMAGE:main"
        docker push "$BACKEND_IMAGE:main"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        docker tag "$BACKEND_IMAGE:$IMAGE_TAG" "$BACKEND_IMAGE:dev"
        docker push "$BACKEND_IMAGE:dev"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$BACKEND_IMAGE:$IMAGE_TAG" "$BACKEND_IMAGE:$CI_COMMIT_TAG"
        docker push "$BACKEND_IMAGE:$CI_COMMIT_TAG"
      fi

build_frontend_image:
  extends: .build_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    - docker build -f frontend/Dockerfile.prod -t "$FRONTEND_IMAGE:$IMAGE_TAG" frontend
    - docker push "$FRONTEND_IMAGE:$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$FRONTEND_IMAGE:$IMAGE_TAG" "$FRONTEND_IMAGE:main"
        docker push "$FRONTEND_IMAGE:main"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        docker tag "$FRONTEND_IMAGE:$IMAGE_TAG" "$FRONTEND_IMAGE:dev"
        docker push "$FRONTEND_IMAGE:dev"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$FRONTEND_IMAGE:$IMAGE_TAG" "$FRONTEND_IMAGE:$CI_COMMIT_TAG"
        docker push "$FRONTEND_IMAGE:$CI_COMMIT_TAG"
      fi

# Deploy using raw kubectl + kustomize overlays (not Helm).
.deploy_template:
  stage: deploy
  tags: [lenovo]
  image:
    name: bitnamilegacy/kubectl:1.30
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - kubectl version --client
  script:
    - sh scripts/k8s/deploy.sh

# DEV deploy on dev branch — ZATIAL VYPNUTY.
# Klaster neexistuje (na sam-lenovo nie je kubectl ani ~/.kube, minikube na
# Macu nebezi) a KUBE_CONFIG nie je definovana. Tento job sa spustal
# AUTOMATICKY na branchi dev, takze kazdy push na dev robil cervenu pipeline.
# Ked budes mat klaster, vrat sem povodne pravidlo:
#     - if: '$CI_COMMIT_BRANCH == "dev"'
deploy_dev:
  extends: .deploy_template
  environment:
    name: dev
  rules:
    - when: never
  variables:
    DEPLOY_ENV: dev
    DEPLOY_IMAGE_TAG: "$IMAGE_TAG"
    RUN_DB_BACKUP: "false"

# DEV deploy from main (manual gate — use after MR merge)
deploy_main_to_dev:
  extends: .deploy_template
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    DEPLOY_ENV: dev
    DEPLOY_IMAGE_TAG: "$IMAGE_TAG"
    RUN_DB_BACKUP: "false"

# PROD deploy on version tags (v*).
deploy_prod:
  extends: .deploy_template
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
      when: manual
  variables:
    DEPLOY_ENV: prod
    DEPLOY_IMAGE_TAG: "$CI_COMMIT_TAG"
    RUN_DB_BACKUP: "true"
